id: insurgency
name: Insurgency Sandstorm
game: insurgency
category: Shooter
description: >-
  Hardcore tactical FPS with co-op-vs-AI and PvP. SteamCMD dedicated server.
icon: insurgency
steamAppId: 581320
image: andrewmhub/insurgency-sandstorm:latest
runtime: steamcmd
stopCommand: ""
dataPath: /home/steam/steamcmd/sandstorm
commandMethod: ""
minMemoryMB: 2048
recMemoryMB: 4096
ports:
  - name: game
    container: 27102
    protocol: udp
    default: 27102
  - name: query
    container: 27131
    protocol: udp
    default: 27131
# The image's entrypoint ends with `-Port=$PORT -QueryPort=$QUERYPORT` and
# defines neither, so both expanded to nothing and the server was handed empty
# port arguments. It came up fully — session created, anti-cheat happy, map
# loaded — on neither of the ports GameNest published, so nobody could reach it.
env:
  PORT: "27102"
  QUERYPORT: "27131"
variables:
  - key: HOSTNAME
    label: Server Name
    description: Name shown in the server browser. Map, mode and other launch options are set via LAUNCH_SERVER_ENV (advanced).
    default: GameNest Insurgency
    type: string
    required: true
