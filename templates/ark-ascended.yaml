id: ark-ascended
name: ARK Survival Ascended
game: ark-ascended
category: Survival
description: >-
  Dinosaur-taming open-world survival (UE5 remaster). Proton dedicated server —
  very heavy: 16 GB RAM and a slow first download.
icon: ark-ascended
steamAppId: 2399830
image: sknnr/ark-ascended-server:latest
runtime: wine
stopCommand: ""
dataPath: /home/steam/ark/ShooterGame/Saved
commandMethod: ""
minMemoryMB: 8192
recMemoryMB: 16384
ports:
  - name: game
    container: 7777
    protocol: udp
    default: 7777
  # No query port. ARK Survival Ascended answers queries on the game port, and
  # the image's launcher passes only -port and an RCON port — it never mentions
  # one. A 90-minute run confirmed it: game and RCON bound throughout, 27015
  # never. Publishing it forwarded a port nothing listens on and, when
  # tunnelled, spent a relay proxy on it.
  - name: rcon
    container: 27020
    protocol: tcp
    default: 27020
env: {}
variables:
  - key: SESSION_NAME
    label: Server name
    default: A GameNest ARK server
    type: string
    required: false
  - key: SERVER_PASSWORD
    label: Server password
    default: ""
    type: string
    required: false
  # The image reads SERVER_ADMIN_PASSWORD, not ADMIN_PASSWORD, and exits 1 when
  # it is empty — so under the old name the server aborted before it ever
  # started. It needs a non-blank default for the same reason; required so the
  # form makes the user replace it rather than shipping a known one.
  - key: SERVER_ADMIN_PASSWORD
    label: Admin password
    description: Required by ARK — set your own, it grants full server control
    default: changeme
    type: string
    required: true
