id: enshrouded
name: Enshrouded
game: enshrouded
category: Survival
description: >-
  Survival-crafting voxel action-RPG for up to 16 players. Dedicated server
  (mornedhels) with auto-saving. RAM-hungry: 8 GB+ recommended.
icon: enshrouded
steamAppId: 1203620
image: mornedhels/enshrouded-server:latest
runtime: steamcmd
stopCommand: ""
dataPath: /opt/enshrouded
commandMethod: ""
minMemoryMB: 6144
recMemoryMB: 8192
# Enshrouded listens on one UDP port, not two. 15636 was a separate game port in
# an older build; the server dropped it, the image marks SERVER_PORT deprecated
# in favour of SERVER_QUERYPORT alone, and its config template writes only
# "queryPort": 15637. Publishing 15636 forwarded a port nothing listens on and
# spent a relay proxy on it, which counts against the per-device tunnel cap.
ports:
  - name: game
    container: 15637
    protocol: udp
    default: 15637
env:
  PUID: "4711"
  PGID: "4711"
variables:
  - key: SERVER_NAME
    label: Server name
    default: A GameNest Enshrouded server
    type: string
    required: false
  - key: SERVER_PASSWORD
    label: Server password
    description: Players need this to join (leave blank for open)
    default: ""
    type: string
    required: false
  - key: SERVER_SLOT_COUNT
    label: Player slots (1-16)
    default: "8"
    type: string
    required: false
