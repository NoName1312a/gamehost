id: conan
name: Conan Exiles
game: conan
category: Survival
description: >-
  Brutal open-world survival in the Conan universe — build, fight, and command
  thralls. Wine dedicated server; heavy RAM and a large first download.
icon: conan
steamAppId: 440900
image: indifferentbroccoli/conan-exiles-enhanced-server-docker:latest
runtime: wine
stopCommand: ""
# /home/steam/conan-dedicated does not exist in this image and never did — the
# volume was mounted at a path the game never touches while SteamCMD installed
# to /home/steam/server-files, so every world would have been discarded on the
# next recreate. Nobody can have data at the old path: Conan could not start at
# all until now, so there is nothing to migrate.
dataPath: /home/steam/server-files
commandMethod: ""
minMemoryMB: 6144
recMemoryMB: 8192
ports:
  - name: game
    container: 7777
    protocol: udp
    default: 7777
  - name: raw
    container: 7778
    protocol: udp
    default: 7778
  - name: query
    container: 27015
    protocol: udp
    default: 27015
# The image's init script exits 1 outright when these are unset — it uses them
# to usermod its steam user before chowning the server files, and refuses to
# guess. Without them Conan never started for anyone.
env:
  PUID: "1000"
  PGID: "1000"
variables:
  - key: SERVER_NAME
    label: Server Name
    description: Name shown in the server browser.
    default: GameNest Conan
    type: string
    required: true
  - key: SERVER_PASSWORD
    label: Password
    description: Join password. Leave empty for a public server.
    default: ""
    type: string
    required: false
  - key: ADMIN_PASSWORD
    label: Admin Password
    description: Server admin password.
    default: ""
    type: string
    required: false
  - key: MAX_PLAYERS
    label: Max Players
    default: "40"
    type: int
    required: false
