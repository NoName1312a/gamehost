id: terraria
name: Terraria
game: terraria
category: Sandbox
description: >-
  2D dig-fight-build-explore sandbox adventure. TShock dedicated server; a world
  is generated on first start from the size you pick below. Tiny footprint.
icon: terraria
steamAppId: 105600
image: ryshe/terraria:latest
runtime: native
stopCommand: ""
dataPath: /root/.local/share/Terraria/Worlds
commandMethod: ""
minMemoryMB: 512
recMemoryMB: 1024
ports:
  - name: game
    container: 7777
    protocol: tcp
    default: 7777
# This image reads only WORLD_FILENAME from the environment; everything else is
# a command argument. Without -autocreate it refuses to make a world and exits,
# and with no WORLD_FILENAME at all it stops at an interactive world-selection
# prompt and never opens its port — so the game could not be started either way.
args:
  - "-autocreate"
  - "${WORLD_SIZE}"
  - "-players"
  - "${MAXPLAYERS}"
  - "-pass"
  - "${PASSWORD}"
env: {}
variables:
  - key: WORLD_FILENAME
    label: World file name
    default: gamehost.wld
    type: string
    required: false
  - key: WORLD_SIZE
    label: World size
    description: 1 = small, 2 = medium, 3 = large
    default: "2"
    type: enum
    options: ["1", "2", "3"]
    required: false
  - key: MAXPLAYERS
    label: Max players
    default: "8"
    type: string
    required: false
  - key: PASSWORD
    label: Server password
    description: Leave blank for an open server
    default: ""
    type: string
    required: false
